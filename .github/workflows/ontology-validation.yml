name: Ontology Validation

# Blocking hosted-runner lane. Validates the GMC-O media ontology with rdflib
# (pure Python, no GPU, no CUDA, no service containers), so it passes reliably
# on GitHub-hosted runners. The GPU/CUDA + milvus/neo4j/postgres integration
# suite lives in test-hybrid.yml and is gated / non-blocking.
#
# NOTE: the ontology and validator sources moved under semantic-recommender/ .
# The previous version of this workflow pointed at top-level design/ontology/**
# and scripts/validate_ontology.py (which does not exist), so it never ran.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ttl-validation:
    name: Ontology TTL Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rdflib
        run: pip install "rdflib>=7.0,<8.0"

      - name: Validate curated media ontology (blocking)
        run: |
          python scripts/ci/validate_ontology_ttl.py \
            semantic-recommender/design/ontology/expanded-media-ontology.ttl

      - name: Validate auxiliary ontology data (non-blocking)
        continue-on-error: true
        run: |
          python scripts/ci/validate_ontology_ttl.py \
            semantic-recommender/data/ontology/robotenique/full.ttl
