name: Hybrid Architecture Tests

# GPU/CUDA + service-container integration suite. These jobs need a self-hosted
# GPU runner (the Rust workspace depends on cudarc / CUDA 11.7) plus milvus,
# neo4j, postgres and redis, so they CANNOT pass on GitHub-hosted runners.
#
# To stop main being permanently red, they no longer run on every push/PR.
# The blocking hosted lane is Ontology Validation (ontology-validation.yml).
#
# Trigger this suite explicitly instead:
#   * manually from the Actions tab (workflow_dispatch), or
#   * on a pull request labelled "run-integration".
# It is non-blocking for normal development.

on:
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: 'Also run the 7000 QPS load test'
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration-tests:
    name: Integration Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: semantic-recommender

    services:
      milvus:
        image: milvusdb/milvus:v2.4.0
        ports:
          - 19530:19530
          - 9091:9091
        options: >-
          --health-cmd="curl -f http://localhost:9091/healthz || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      neo4j:
        image: neo4j:5.15
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd="cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 10

      - name: Run integration tests
        run: cargo test --test hybrid_integration_tests --release -- --test-threads=1
        env:
          MILVUS_ENDPOINT: localhost:19530
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          POSTGRES_URL: postgres://postgres:testpassword@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: semantic-recommender/target/test-results/
          if-no-files-found: ignore

  chaos-tests:
    name: Chaos Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: semantic-recommender

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Start test infrastructure
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Run chaos tests
        run: cargo test --test chaos_tests --release -- --ignored --test-threads=1

      - name: Collect chaos test logs
        if: always()
        run: |
          docker logs $(docker ps -q -f name=milvus) > milvus.log 2>&1 || true
          docker logs $(docker ps -q -f name=neo4j) > neo4j.log 2>&1 || true
          docker logs $(docker ps -q -f name=postgres) > postgres.log 2>&1 || true

      - name: Upload chaos test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-logs
          path: semantic-recommender/*.log
          if-no-files-found: ignore

  load-tests:
    name: Load Tests (7000 QPS)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_load_tests
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: semantic-recommender

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Start production-like infrastructure
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for services
        run: sleep 30

      - name: Run 7000 QPS load test
        run: cargo test --test load_tests --release test_sustained_load_7000_qps -- --ignored --nocapture

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: semantic-recommender/*.json
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
