[package]
name = "semantic-recommender-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "semantic-rec"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
media-recommendation-engine = { path = "../../src/rust" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

# CLI-specific dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif = "0.17"
colored = "2.1"
tabled = "0.15"
csv = "1.3"

# Performance monitoring
sysinfo = "0.30"

[features]
default = ["cpu-only"]
gpu = ["media-recommendation-engine/gpu"]
cpu-only = ["media-recommendation-engine/cpu-only"]

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "cli_benchmarks"
harness = false
