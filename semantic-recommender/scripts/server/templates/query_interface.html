<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Query Interface - Decision Logic Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .backend-info {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .query-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        select, input[type="number"] {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .decision-log, .results-list {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .step {
            background: #f5f7fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .step-name {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .step-time {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .step-details {
            font-size: 14px;
            color: #666;
        }

        .step-details pre {
            background: white;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            margin-top: 5px;
            font-size: 12px;
        }

        .result-item {
            background: #f5f7fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .result-score {
            background: #52c41a;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .result-meta {
            font-size: 14px;
            color: #666;
        }

        .ontology-info {
            background: #e8eaf6;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 13px;
        }

        .ontology-classes {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        .onto-class {
            background: #3f51b5;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .hybrid-scores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        .score-breakdown {
            text-align: center;
            padding: 5px;
            background: white;
            border-radius: 3px;
        }

        .score-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .performance-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .perf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .perf-item {
            text-align: center;
        }

        .perf-value {
            font-size: 24px;
            font-weight: bold;
        }

        .perf-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MCP Query Interface - Decision Logic Visualization</h1>
            <p>Real-time visualization of all recommendation decision steps and fields</p>
            <div class="backend-info">
                <span class="badge" id="backend-type">Backend: {{ backend_type }}</span>
                <span class="badge" id="status">Status: Ready</span>
            </div>
        </div>

        <div class="query-section">
            <div class="search-box">
                <input type="text" id="query-input" placeholder="Enter your search query (e.g., 'sci-fi action movies with time travel')" value="animated family movies">
                <button id="search-btn" onclick="executeQuery()">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Limit</label>
                    <input type="number" id="limit-input" value="10" min="1" max="50">
                </div>
                <div class="filter-group">
                    <label>Min Rating</label>
                    <input type="number" id="rating-input" value="" min="0" max="5" step="0.1" placeholder="Any">
                </div>
                <div class="filter-group">
                    <label>Year From</label>
                    <input type="number" id="year-from" value="" min="1900" max="2025" placeholder="Any">
                </div>
                <div class="filter-group">
                    <label>Year To</label>
                    <input type="number" id="year-to" value="" min="1900" max="2025" placeholder="Any">
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing query...</p>
        </div>

        <div class="results-container" id="results-container" style="display: none;">
            <div class="decision-log">
                <h2>📊 Decision Logic</h2>
                <div class="performance-summary" id="perf-summary"></div>
                <div id="decision-steps"></div>
            </div>

            <div class="results-list">
                <h2>🎬 Results</h2>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script>
        async function executeQuery() {
            const query = document.getElementById('query-input').value;
            const limit = parseInt(document.getElementById('limit-input').value);
            const minRating = document.getElementById('rating-input').value;
            const yearFrom = document.getElementById('year-from').value;
            const yearTo = document.getElementById('year-to').value;

            if (!query.trim()) {
                alert('Please enter a search query');
                return;
            }

            // Build filters
            const filters = {};
            if (minRating) filters.min_rating = parseFloat(minRating);
            if (yearFrom && yearTo) filters.year_range = [parseInt(yearFrom), parseInt(yearTo)];

            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('search-btn').disabled = true;

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query, limit, filters})
                });

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                alert('Error processing query: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('search-btn').disabled = false;
            }
        }

        function displayResults(data) {
            // Show results container
            document.getElementById('results-container').style.display = 'grid';

            // Performance summary
            const perf = data.performance;
            document.getElementById('perf-summary').innerHTML = `
                <h3>⚡ Performance Metrics</h3>
                <div class="perf-grid">
                    <div class="perf-item">
                        <div class="perf-value">${perf.total_time_ms.toFixed(2)}ms</div>
                        <div class="perf-label">Total Time</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value">${perf.encoding_time_ms.toFixed(2)}ms</div>
                        <div class="perf-label">Encoding</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value">${perf.similarity_time_ms.toFixed(2)}ms</div>
                        <div class="perf-label">Similarity</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value">${perf.items_searched.toLocaleString()}</div>
                        <div class="perf-label">Items Searched</div>
                    </div>
                </div>
            `;

            // Decision steps
            const stepsHTML = data.decision_log.steps.map(step => `
                <div class="step">
                    <div class="step-header">
                        <span class="step-name">Step ${step.step}: ${step.name}</span>
                        <span class="step-time">${step.duration_ms.toFixed(3)}ms</span>
                    </div>
                    <div class="step-details">
                        ${step.parameters ? `<strong>Parameters:</strong> ${JSON.stringify(step.parameters)}<br>` : ''}
                        ${step.filters_applied ? `<strong>Filters:</strong> ${JSON.stringify(step.filters_applied)}<br>` : ''}
                        <strong>Output:</strong>
                        <pre>${JSON.stringify(step.output, null, 2)}</pre>
                    </div>
                </div>
            `).join('');
            document.getElementById('decision-steps').innerHTML = stepsHTML;

            // Results
            const resultsHTML = data.results.map(result => {
                let ontologyHTML = '';
                if (result.ontology) {
                    const classesHTML = result.ontology.shared_classes.map(c =>
                        `<span class="onto-class">${c}</span>`
                    ).join('');

                    ontologyHTML = `
                        <div class="ontology-info">
                            <strong>🧠 Ontology Reasoning:</strong>
                            ${result.ontology.shared_classes.length > 0 ?
                                `<div class="ontology-classes">${classesHTML}</div>` :
                                '<div style="font-size: 12px; color: #888;">No shared ontology classes</div>'
                            }
                            <div class="hybrid-scores">
                                <div class="score-breakdown">
                                    <div class="score-label">Semantic</div>
                                    <div class="score-value">${(result.similarity_score * 100).toFixed(1)}%</div>
                                </div>
                                <div class="score-breakdown">
                                    <div class="score-label">Ontology</div>
                                    <div class="score-value">${(result.ontology.ontology_score * 100).toFixed(1)}%</div>
                                </div>
                                <div class="score-breakdown">
                                    <div class="score-label">Genre</div>
                                    <div class="score-value">${(result.ontology.genre_score * 100).toFixed(1)}%</div>
                                </div>
                            </div>
                            ${result.hybrid_score ?
                                `<div style="margin-top: 8px; text-align: center;">
                                    <strong>Hybrid Score:</strong>
                                    <span style="color: #667eea; font-size: 16px;">${(result.hybrid_score * 100).toFixed(1)}%</span>
                                    <span style="font-size: 11px; color: #888;">(70% sem + 20% onto + 10% genre)</span>
                                </div>` : ''
                            }
                        </div>
                    `;
                }

                return `
                    <div class="result-item">
                        <div class="result-header">
                            <span class="result-title">#${result.rank}. ${result.title}</span>
                            <span class="result-score">${result.hybrid_score ?
                                (result.hybrid_score * 100).toFixed(1) :
                                (result.similarity_score * 100).toFixed(1)}%</span>
                        </div>
                        <div class="result-meta">
                            📁 ${result.metadata.genres.join(', ') || 'No genres'} |
                            📅 ${result.metadata.year || 'Unknown'} |
                            ⭐ ${result.metadata.rating.toFixed(1)}/5.0
                        </div>
                        ${ontologyHTML}
                    </div>
                `;
            }).join('');
            document.getElementById('results').innerHTML = resultsHTML;
        }

        // Allow Enter key to search
        document.getElementById('query-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeQuery();
        });

        // Auto-execute on load
        window.addEventListener('load', () => {
            setTimeout(executeQuery, 500);
        });
    </script>
</body>
</html>
