[build]
rustflags = [
    # CUDA-specific optimizations
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=lld",  # Use LLD linker for faster builds
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+fma",  # Enable AVX2 and FMA
]

# Environment variables for CUDA
[env]
CUDA_PATH = "/usr/local/cuda"
CUDA_LIBRARY_PATH = "/usr/local/cuda/lib64"
LD_LIBRARY_PATH = "/usr/local/cuda/lib64:${LD_LIBRARY_PATH}"

# Alias for common commands
[alias]
bench-all = "bench --workspace --features benchmarks"
test-all = "test --workspace --all-features"
check-cuda = "check --features cuda"
check-cpu = "check --features cpu-only"
build-release = "build --release --profile release-lto"
flamegraph = "bench --bench latency --features pprof -- --profile-time=5"
