[workspace]
members = [
    "crates/gpu-embeddings",
    "crates/temporal-cache",
    "crates/attention",
    "crates/semantic-model",
    "crates/hyper-personalization",
    "crates/benchmarks",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Semantic Recommender Team"]
license = "MIT"
repository = "https://github.com/jjohare/hackathon-tv5"
rust-version = "1.75"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }
futures = "0.3"

# GPU acceleration
cudarc = { version = "0.11", features = ["cuda-11070", "cublas", "cudnn"] }

# Linear algebra (CPU fallback)
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.8"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
num-traits = "0.2"

# ONNX Runtime
ort = { version = "2.0", features = ["cuda", "download-binaries"] }

# Metrics and monitoring
prometheus = "0.13"
metrics = "0.21"

# CLI
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
indicatif = "0.17"
colored = "2.1"

# Testing
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"
quickcheck = "1.0"
fake = "2.9"

# Benchmarking
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }

[profile.dev]
opt-level = 1              # Some optimizations for dev
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3              # Maximum optimizations
lto = "thin"               # Thin LTO (balance compile time vs performance)
codegen-units = 1          # Single codegen unit for maximum inlining
panic = "abort"            # Smaller binary, no unwinding
strip = false              # Keep symbols for profiling
incremental = false        # Disable for release builds

[profile.release-lto]
inherits = "release"
lto = "fat"                # Fat LTO for maximum performance
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true               # Keep debug symbols for profiling
strip = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Feature flags
[workspace.metadata.features]
default = ["cuda", "onnx"]
cuda = ["cudarc"]
cpu-only = []
onnx = ["ort"]
distributed = []
metrics = ["prometheus"]
simd = []

# Patch section for local development
[patch.crates-io]
# cudarc = { git = "https://github.com/coreylowman/cudarc", branch = "main" }
