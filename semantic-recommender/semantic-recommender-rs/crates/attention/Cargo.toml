[package]
name = "attention"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Multi-head attention mechanism for context-aware reranking"
keywords = ["attention", "transformer", "cuda", "neural-network", "reranking"]
categories = ["algorithms", "science"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
num-traits = { workspace = true }

# Crate-specific
bytemuck = "1.14"
tch = "0.16"

# Local dependencies
gpu-embeddings = { path = "../gpu-embeddings" }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = "0.4"
approx = "0.5"

[features]
default = ["cuda"]
cuda = []
cpu-fallback = []

[[bench]]
name = "attention_bench"
harness = false
path = "benches/attention_bench.rs"

[lib]
bench = false
