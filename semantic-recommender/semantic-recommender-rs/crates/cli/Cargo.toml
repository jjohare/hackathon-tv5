[package]
name = "semantic-recommender-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Command-line interface for semantic recommender system"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }

# Local dependencies
hyper-personalization = { path = "../hyper-personalization" }

# CLI-specific
comfy-table = "7.1"
dialoguer = "0.11"

[features]
default = ["cuda"]
cuda = ["hyper-personalization/cuda"]
cpu-only = ["hyper-personalization/cpu-only"]

[[bin]]
name = "semantic-recommender"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
