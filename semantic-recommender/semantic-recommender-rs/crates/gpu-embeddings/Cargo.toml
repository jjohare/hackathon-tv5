[package]
name = "gpu-embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "GPU-accelerated user embeddings with real-time updates"
keywords = ["gpu", "embeddings", "cuda", "personalization", "ml"]
categories = ["algorithms", "science"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
cudarc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
num-traits = { workspace = true }
bincode = { workspace = true }

# Crate-specific
bytemuck = "1.14"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = "0.4"
fake = { workspace = true }

[features]
default = ["cuda"]
cuda = ["cudarc/cuda-11070", "cudarc/cublas"]
cpu-fallback = []
simd = []

[[bench]]
name = "embedding_bench"
harness = false
path = "benches/embedding_bench.rs"

[lib]
bench = false
